[project]
name = "enterprise-agent-platform-server"
version = "0.1.0"
description = "Enterprise Agent Platform control API and runtime boundary"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "redis>=5,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.14,<2",
  "langgraph>=0.2,<2",
  "minio>=7.2,<8",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "pgvector>=0.3,<1",
  "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
