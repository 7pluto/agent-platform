ruoyi:
  profile: /data/uploadPath

spring:
  datasource:
    druid:
      master:
        url: jdbc:mysql://ruoyi-mysql:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8
        username: ruoyi
        password: ${RUOYI_DB_PASSWORD}
  data:
    redis:
      host: ruoyi-redis
      port: 6379
      password: ${RUOYI_REDIS_PASSWORD}

token:
  secret: ${RUOYI_TOKEN_SECRET}

agent-iam:
  organization-id: ruoyi-default

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.ruoyi: info