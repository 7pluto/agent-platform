apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }}-console, labels: {{- include "agent-platform.labels" . | nindent 4 }} }
spec:
  replicas: {{ .Values.console.replicas }}
  selector: { matchLabels: { app.kubernetes.io/component: console, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/component: console, app.kubernetes.io/instance: {{ .Release.Name }} } }
    spec:
      containers:
        - name: console
          image: {{ .Values.console.image | quote }}
          ports: [{ containerPort: {{ .Values.console.port }} }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-console, labels: {{- include "agent-platform.labels" . | nindent 4 }} }
spec:
  selector: { app.kubernetes.io/component: console, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ port: 80, targetPort: {{ .Values.console.port }} }]