map $http_x_forwarded_proto $agent_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  location /api/ {
    # Docker replaces a service container IP whenever API is recreated. Resolve
    # the service name at request time so the Console never keeps a stale IP
    # and turns login/captcha API calls into a 502 response.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $agent_api http://agent-server:8000;
    proxy_pass $agent_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Preserve the HTTPS origin reported by Caddy rather than replacing it
    # with this internal HTTP hop.
    proxy_set_header X-Forwarded-Proto $agent_forwarded_proto;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
}
